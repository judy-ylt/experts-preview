<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>專家詳情預覽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --brand: #004896; --brand-ink: #004896; --brand-deep: #004896; --accent: #3BB3F0;
    --ink: #111827; --body: #374151; --muted: #6b7280; --line: #e5e7eb;
    --soft: color-mix(in srgb, var(--brand) 5%, #f5f6f8);   /* 淡主色灰：段落交替用 */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-padding-top: 76px; }
  body { background: #fff; color: var(--ink); font-family: "Noto Sans TC", system-ui, sans-serif; line-height: 1.6; }
  a { color: inherit; }
  ul { list-style: none; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; border-radius: 8px; }

  /* 預覽工具列 */
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; background: #f9fafb; border-bottom: 1px solid var(--line); font-size: 14px; color: var(--muted); }
  .toolbar button { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line); cursor: pointer; }
  .toolbar button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
  .toolbar a { padding: 4px 12px; border-radius: 999px; text-decoration: none; border: 1px solid var(--line); }
  .toolbar a[aria-current] { background: var(--ink); color: #fff; border-color: var(--ink); }

  /* 共用 */
  .pill { display: inline-flex; align-items: center; padding: 6px 16px; border-radius: 999px; font-size: 14px;
    background: color-mix(in srgb, var(--brand) 9%, transparent); color: var(--brand-ink); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 28px; border-radius: 999px;
    font-size: 16px; font-weight: 600; text-decoration: none; transition: background .2s, border-color .2s, color .2s; }
  /* #237 箭頭接力：滑過時箭頭往右滑出、再從左邊滑回來 */
  .btn .arrow { display: inline-block; }
  .btn:hover .arrow { animation: arrow-relay .5s cubic-bezier(.33,1,.68,1); }
  @keyframes arrow-relay { 0% { transform: none; opacity: 1; } 45% { transform: translateX(14px); opacity: 0; }
    46% { transform: translateX(-14px); opacity: 0; } 100% { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .btn:hover .arrow { animation: none; } }
  .btn--primary { background: var(--brand-ink); color: #fff; }
  .btn--primary:hover { background: color-mix(in srgb, var(--brand-ink) 85%, black); }
  .btn--white { background: #fff; color: var(--brand-ink); }
  .btn--white:hover { background: #eef2f7; }
  .btn--line { border: 1px solid rgba(255,255,255,.6); color: #fff; }
  .btn--line:hover { background: rgba(255,255,255,.12); border-color: #fff; }
  .label { font-family: "Barlow Semi Condensed", sans-serif; font-weight: 600; font-size: 13px; letter-spacing: .3em; color: var(--brand-ink); }

  /* 頁首 */
  .bar { background: #fff; border-bottom: 1px solid var(--line); }
  .bar .wrap { display: flex; align-items: center; justify-content: space-between; height: 64px; }
  .logo { font-weight: 700; color: var(--brand-ink); text-decoration: none; line-height: 1.2; }
  .logo small { display: block; font-family: "Barlow Semi Condensed", sans-serif; font-size: 11px; letter-spacing: .2em; color: var(--muted); }
  .bar nav { display: flex; gap: 28px; font-size: 15px; }
  .bar nav a { text-decoration: none; color: var(--body); }
  .bar nav a:hover { color: var(--brand-ink); }
  .bar .btn { min-height: 40px; padding: 0 20px; font-size: 14px; }

  /* ① 主視覺：滿版主色色帶，照片往下跨出色帶 */
  .hero { position: relative; color: #fff;
    background: linear-gradient(120deg, var(--brand-deep) 0%, var(--brand-deep) 55%, color-mix(in srgb, var(--brand-deep) 80%, var(--accent)) 100%); }
  .hero .wrap { position: relative; display: grid; grid-template-columns: 1fr 360px; gap: 0 48px; padding-top: 8px; padding-bottom: 36px; }
  .back { grid-column: 1 / -1; justify-self: start; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; margin-bottom: 8px; font-size: 14px; color: rgba(255,255,255,.75); text-decoration: none; }
  .back:hover { color: #fff; }
  .hero__text { align-self: center; }
  .hero__fields { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
  .hero__fields li { padding: 4px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,.55); font-size: 13px; }
  .hero h1 { font-size: 72px; font-weight: 900; line-height: 1.05; letter-spacing: .08em; }
  .hero h1 small { font-size: 22px; font-weight: 500; letter-spacing: .15em; margin-left: 12px; opacity: .8; }
  .hero__roles { display: flex; align-items: center; gap: 16px; margin: 24px 0 32px; }
  .hero__roles::before { content: ""; flex: none; width: 48px; height: 1px; background: rgba(255,255,255,.6); } /* 細線把視線帶到職務 */
  .hero__roles ul { display: grid; gap: 4px; font-size: 16px; color: rgba(255,255,255,.9); }
  .hero__cta { display: flex; flex-wrap: wrap; gap: 12px; }
  /* 圓形破框（同列表卡片），圓形改白色漸層；在色帶裡上下置中 */
  .portrait { grid-row: 2; grid-column: 2; position: relative; align-self: center; aspect-ratio: 4 / 5; transform: translateY(-4%); } /* 讓「頭頂到圓底」整個人像對準色帶中心 */
  .portrait__bg { position: absolute; inset: 20% 0 0 0; border-radius: 50%;
    background: linear-gradient(180deg, color-mix(in srgb, #fff 95%, var(--brand-deep)) 0%, color-mix(in srgb, #fff 55%, var(--brand-deep)) 50%, color-mix(in srgb, #fff 12%, var(--brand-deep)) 100%); } /* 不透明，點陣不會透出來 */
  /* 比較版：上方很淡、往下越白 */
  [data-circle="up"] .portrait__bg { background: linear-gradient(180deg, color-mix(in srgb, #fff 12%, var(--brand-deep)) 0%, color-mix(in srgb, #fff 50%, var(--brand-deep)) 55%, color-mix(in srgb, #fff 92%, var(--brand-deep)) 100%); }
  .portrait img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center top;
    -webkit-mask: linear-gradient(#000 0 0) top / 100% 60% no-repeat, radial-gradient(circle closest-side at 50% 60%, #000 calc(100% - .5px), transparent 100%);
            mask: linear-gradient(#000 0 0) top / 100% 60% no-repeat, radial-gradient(circle closest-side at 50% 60%, #000 calc(100% - .5px), transparent 100%); }

  /* ---- 色帶幾何裝飾（比較用）：都放在照片後方、低透明度白色 ---- */
  .hero { overflow: hidden; }
  .hero__deco { position: absolute; inset: 0; pointer-events: none; }
  .hero .wrap { z-index: 1; }
  /* A 同心圓：呼應圓形照片，從照片中心往外擴散 */
  [data-deco="rings"] .hero__deco { background:
    repeating-radial-gradient(circle at 77% 55%, transparent 0 79px, rgba(255,255,255,.10) 79px 80px); 
    -webkit-mask: radial-gradient(circle at 77% 55%, #000 0, #000 30%, transparent 62%); mask: radial-gradient(circle at 77% 55%, #000 0, #000 30%, transparent 62%); }
  /* B 點陣：左下與右上角落 */
  [data-deco="dots"] .hero__deco { background-image: radial-gradient(rgba(255,255,255,.3) 1.5px, transparent 1.7px); background-size: 22px 22px;
    /* 範圍放大：右側大片（照片後方）＋左下角，往文字區淡出，不干擾閱讀 */
    -webkit-mask: radial-gradient(ellipse 42% 90% at 96% 40%, #000 20%, transparent 75%), radial-gradient(ellipse 45% 70% at 0% 100%, #000 10%, transparent 72%);
            mask: radial-gradient(ellipse 42% 90% at 96% 40%, #000 20%, transparent 75%), radial-gradient(ellipse 45% 70% at 0% 100%, #000 10%, transparent 72%); }
  @media (max-width: 767px) {
    [data-deco="dots"] .hero__deco { background-size: 18px 18px;
      -webkit-mask: radial-gradient(ellipse 90% 45% at 50% 18%, #000 20%, transparent 80%); mask: radial-gradient(ellipse 90% 45% at 50% 18%, #000 20%, transparent 80%); }
  }
  /* C 細格線：淡淡的方格，往中間淡出 */
  [data-deco="grid"] .hero__deco { background-image: linear-gradient(rgba(255,255,255,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.08) 1px, transparent 1px);
    background-size: 56px 56px; background-position: center;
    -webkit-mask: linear-gradient(90deg, transparent 0%, #000 55%, #000 100%); mask: linear-gradient(90deg, transparent 0%, #000 55%, #000 100%); }
  /* D 大圓弧：兩個超大的淡色圓，一半在畫面外 */
  [data-deco="arcs"] .hero__deco::before, [data-deco="arcs"] .hero__deco::after { content: ""; position: absolute; border-radius: 50%; }
  [data-deco="arcs"] .hero__deco::before { width: 760px; height: 760px; right: -220px; top: -260px; background: rgba(255,255,255,.06); }
  [data-deco="arcs"] .hero__deco::after { width: 420px; height: 420px; left: -160px; bottom: -220px; border: 1px solid rgba(255,255,255,.18); }
  @media (max-width: 767px) {
    [data-deco="rings"] .hero__deco { background: repeating-radial-gradient(circle at 50% 22%, transparent 0 59px, rgba(255,255,255,.10) 59px 60px);
      -webkit-mask: radial-gradient(circle at 50% 22%, #000 0, #000 25%, transparent 55%); mask: radial-gradient(circle at 50% 22%, #000 0, #000 25%, transparent 55%); }
  }
  /* ② 數據：放進色帶底部（預設）；另一版為浮在色帶邊緣的白卡 */
  .stats { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 40px; padding-top: 28px; border-top: 1px solid rgba(255,255,255,.22); }
  .stat { text-align: center; } /* 每個數值在自己的欄位內置中 */
  .stat + .stat { border-left: 1px solid rgba(255,255,255,.22); }
  .stat b { display: block; font-family: "Barlow Semi Condensed", sans-serif; font-size: 44px; line-height: 1; color: #fff; font-variant-numeric: tabular-nums; }
  .stat span { display: block; margin-top: 8px; font-size: 15px; color: rgba(255,255,255,.75); }
  /* 數據共用的總標（例「累積授課與輔導」），下面每格只寫單位，不再重複整句 */
  .stats__cap { grid-column: 1 / -1; margin-bottom: 18px; text-align: center; font-size: 14px; letter-spacing: .1em; color: rgba(255,255,255,.75); }
  /* 浮動白卡版 */
  [data-stats="card"] .hero .wrap { padding-bottom: 0; z-index: 6; } /* 讓白卡壓在下方導覽列之上 */
  [data-stats="card"] .stats { position: relative; z-index: 6; margin: 40px 0 -56px; padding: 28px 40px; border: 0; border-radius: 28px; background: #fff;
    box-shadow: 0 12px 36px rgba(17,24,39,.12); }
  [data-stats="card"] .hero { overflow: visible; }
  [data-stats="card"] .hero__deco { overflow: hidden; }
  [data-stats="card"] .stat + .stat { border-left-color: var(--line); }
  [data-stats="card"] .stat b { color: var(--brand-ink); }
  [data-stats="card"] .stat span { color: var(--muted); }
  [data-stats="card"] .subnav .wrap { padding-top: 76px; }
  /* 頁內導覽 */
  .subnav { position: sticky; top: 0; z-index: 5; background: #fff; border-bottom: 1px solid var(--line); }
  .subnav .wrap { display: flex; gap: 16px; padding-top: 10px; padding-bottom: 10px; overflow-x: auto; scrollbar-width: none; }
  .subnav .wrap::-webkit-scrollbar { display: none; }
  .subnav a { flex: none; display: inline-flex; align-items: center; min-height: 42px; padding: 0 16px; border-radius: 999px; font-size: 14px;
    text-decoration: none; color: var(--body); background: #fff; border: 1px solid #d9dde3; transition: color .2s, background .2s, border-color .2s;
    justify-content: center; min-width: 176px; font-size: 15px; } /* 只有 3 項，加寬讓選單撐開 */
  /* 置中；項目多到放不下時仍可左右滑（用 auto 邊距置中，滑動時左邊不會被切掉） */
  .subnav a:first-child { margin-left: auto; }
  .subnav a:last-child { margin-right: auto; }
  .subnav a:hover { border-color: var(--brand-ink); color: var(--brand-ink); }
  .subnav a[aria-current="true"] { background: color-mix(in srgb, var(--brand) 10%, white); border-color: var(--brand-ink); color: var(--brand-ink); font-weight: 600; }

  /* ④ 段落：左標題、右內容；背景交替 */
  .sec { padding: 88px 0; }
  .sec--soft { background: var(--soft); }
  /* 灰底段落加淡淡主色點陣（呼應主視覺）：只在右上角，往內淡出，不壓到文字 */
  .sec--soft { position: relative; overflow: clip; } /* 用 clip 不用 hidden：hidden 會讓左側標題的「跟著捲動」失效 */
  .sec--soft::before { content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: radial-gradient(color-mix(in srgb, var(--brand) 22%, transparent) 1.5px, transparent 1.7px); background-size: 22px 22px;
    -webkit-mask: radial-gradient(ellipse 38% 70% at 100% 0%, #000 15%, transparent 75%), radial-gradient(ellipse 28% 55% at 0% 100%, #000 10%, transparent 72%);
            mask: radial-gradient(ellipse 38% 70% at 100% 0%, #000 15%, transparent 75%), radial-gradient(ellipse 28% 55% at 0% 100%, #000 10%, transparent 72%); }
  .sec--soft .wrap { position: relative; }
  .sec .wrap { display: grid; grid-template-columns: 280px 1fr; gap: 56px; }
  .sec__head h2 { font-size: 30px; line-height: 1.3; letter-spacing: .05em; margin-top: 6px; }
  .sec__head h2::after { content: ""; display: block; width: 36px; height: 3px; border-radius: 2px; background: var(--brand); margin-top: 16px; } /* 標題下短色條 */
  .sec__head p { margin-top: 16px; color: var(--muted); font-size: 15px; }
  .sec__head { position: sticky; top: 96px; align-self: start; }

  .services { display: grid; gap: 20px; }
  .svc { background: #fff; border: 1px solid color-mix(in srgb, var(--brand) 8%, var(--line)); box-shadow: 0 1px 3px rgba(17,24,39,.04); border-radius: 28px; padding: 28px 32px; }
  .svc h3 { display: flex; align-items: baseline; justify-content: space-between; font-size: 19px; padding-bottom: 16px; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
  .svc h3 span { font-size: 13px; font-weight: 500; color: var(--muted); }
  .dots { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 32px; font-size: 15px; }
  .dots--one { grid-template-columns: 1fr; }
  .dots li { position: relative; padding-left: 20px; color: var(--body); }
  .dots li::before { content: ""; position: absolute; left: 2px; top: .62em; width: 8px; height: 8px; border-radius: 50%; background: var(--brand); opacity: .5; }
  .dots b { display: block; color: var(--ink); font-weight: 600; }
  .sec--soft .midcta { background: #fff; border: 1px solid var(--line); }
  .midcta { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 20px 20px 20px 32px; border-radius: 999px; background: var(--soft); }
  .midcta b { color: var(--ink); }
  .midcta p { color: var(--body); }

  .sub { font-size: 14px; font-weight: 500; color: var(--muted); margin-bottom: 12px; }
  .skills { display: flex; flex-wrap: wrap; gap: 10px; }
  .skills + .sub { margin-top: 32px; }
  .skills--field .pill { background: #fff; border: 1px solid color-mix(in srgb, var(--brand) 30%, transparent); font-weight: 600; }
  .skills .pill { font-size: 15px; padding: 8px 18px; }
  .sec--soft .skills:not(.skills--field) .pill { background: #fff; }
  /* 專長：分組條列（取代一整片一樣的膠囊），沒分組時就一組不加小標 */
  .skillcols { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 28px 32px; }
  .skillcols h3 { font-size: 16px; color: var(--brand-ink); margin-bottom: 14px; }
  .skillcols .dots { gap: 10px; }
  .skillcols--flat .dots { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .skills--field { margin-bottom: 36px; }
  /* 服務清單：手機版預設只顯示前 3 項，可展開 */
  .svc__more { display: none; }
  /* 資料少的老師：邀請句直接放進主視覺，不另開一段 */
  .hero__invite { margin: -12px 0 28px; font-size: 15px; color: var(--body); }
  .hero__invite b { display: block; font-size: 17px; color: var(--ink); margin-bottom: 2px; }

  /* ⑤ 經歷分欄＋主色細線 */
  .cols { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 32px; }
  .col { border-top: 2px solid var(--brand); padding-top: 20px; }
  .col h3 { font-size: 17px; margin-bottom: 16px; color: var(--brand-ink); }
  .col ul { display: grid; gap: 12px; font-size: 15px; color: var(--body); }
  .col li { padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .col a { display: flex; justify-content: space-between; gap: 8px; text-decoration: none; }
  .col a:hover { color: var(--brand-ink); }
  .col a small { display: block; color: var(--muted); font-size: 13px; }

  /* ⑥ 行動呼籲：滿版主色色帶 */
  .cta { color: #fff; background: linear-gradient(120deg, var(--brand-deep) 0%, var(--brand-deep) 55%, color-mix(in srgb, var(--brand-deep) 80%, var(--accent)) 100%); }
  .cta .wrap { display: flex; align-items: center; justify-content: space-between; gap: 32px; flex-wrap: wrap; padding-top: 72px; padding-bottom: 72px; }
  .cta h2 { font-size: 30px; letter-spacing: .04em; line-height: 1.4; }
  .cta p { opacity: .85; margin-top: 8px; }

  /* 相關領域專家：跟總覽頁同一套（淡主色底＋點陣、靠左標題＋細線、圓形卡片、按鈕整合進頭像） */
  .more { position: relative; overflow: clip; background: var(--soft); padding: 88px 0 96px; }
  .more::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: radial-gradient(color-mix(in srgb, var(--brand) 22%, transparent) 1.5px, transparent 1.7px); background-size: 22px 22px;
    -webkit-mask: radial-gradient(ellipse 34% 45% at 100% 0%, #000 15%, transparent 75%), radial-gradient(ellipse 30% 40% at 0% 100%, #000 10%, transparent 72%);
            mask: radial-gradient(ellipse 34% 45% at 100% 0%, #000 15%, transparent 75%), radial-gradient(ellipse 30% 40% at 0% 100%, #000 10%, transparent 72%); }
  .more .wrap { position: relative; z-index: 1; }
  .more .head { margin-bottom: 40px; }
  .more .head__top { display: flex; align-items: center; gap: 28px; }
  .more .head h2 { flex: none; font-size: 40px; font-weight: 700; line-height: 1.3; letter-spacing: .06em; }
  .more .head__line { flex: 1; height: 1px; background: color-mix(in srgb, var(--brand-ink) 35%, transparent); }
  .hl { color: var(--brand-ink); }
  .more .head__sub { margin-top: 10px; color: var(--muted); font-size: 16px; }
  .grid { --gap: 28px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0 var(--gap); }
  .card { min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr); grid-row: span 5; grid-template-rows: subgrid; row-gap: 0; text-align: center; }
  a.photo { position: relative; display: block; width: 100%; align-self: start; aspect-ratio: 4 / 5; cursor: pointer; text-decoration: none; }
  .photo__bg { position: absolute; inset: calc(20% + 1.5px) 1.5px 1.5px 1.5px; border-radius: 50%; transition: background .4s ease;
    background: linear-gradient(180deg, color-mix(in srgb, var(--brand) 22%, transparent) 0%, color-mix(in srgb, var(--brand) 70%, transparent) 50%, var(--brand) 100%); }
  .photo__person { position: absolute; z-index: 2; inset: 0; clip-path: inset(-40% 0 0 0);
    -webkit-mask: linear-gradient(#000 0 0) top / 100% 60% no-repeat, radial-gradient(circle closest-side at 50% 60%, #000 calc(100% - .5px), transparent 100%);
            mask: linear-gradient(#000 0 0) top / 100% 60% no-repeat, radial-gradient(circle closest-side at 50% 60%, #000 calc(100% - .5px), transparent 100%); }
  .photo__person img { width: 100%; height: 100%; object-fit: cover; object-position: center top; transform-origin: center bottom; transition: transform .4s cubic-bezier(.33,1,.68,1); }
  .photo::after { content: ""; position: absolute; z-index: 3; inset: 0; background: linear-gradient(to top, var(--brand-deep) 0%, transparent 28%);
    -webkit-mask: radial-gradient(circle closest-side at 50% 60%, #000 calc(100% - .5px), transparent 100%); mask: radial-gradient(circle closest-side at 50% 60%, #000 calc(100% - .5px), transparent 100%); }
  .photo__name { position: absolute; z-index: 4; left: 10%; right: 10%; bottom: 8%; color: #fff; font-size: 26px; font-weight: 700; line-height: 1.2; letter-spacing: .12em;
    transition: opacity .22s ease .12s, transform .3s cubic-bezier(.33,1,.68,1) .12s; } /* 離開時：文字先收、名字再回來 */
  .photo__initial { position: absolute; z-index: 1; inset: 20% 0 0 0; display: grid; place-items: center; font-size: 96px; font-weight: 700; line-height: 1; color: #fff; opacity: .55; }
  .photo__initial > span { transform: translateY(-.04em); }

      { name: '思維與決策', items: ['習慣領域學理與應用','習慣領域與創新決策','創新動態學','系統性思考','概念性思考'] },
      { name: '經營與策略', items: ['高績效的經營管理','企業創新與轉型','贏贏策略','目標管理','AI 與資訊系統'] },
      { name: '組織與人才', items: ['優良企業文化的塑造與落實','人才發展','企業的七個習慣力'] },
    ],
    education: ['國立陽明交通大學<br>資訊管理研究所 博士','國立陽明交通大學<br>經營管理研究所 碩士'],
    links: [['個人網站','ken.hdhd.co','http://ken.hdhd.co'],['經營管理專欄','ipedia.tw/author/kantian','https://ipedia.tw/author/kantian/']],
  },
  weng: {
    name: '翁瑞鋒', title: '老師', img: 'weng-rui-feng',
    tagline: '科技藝術、人工智慧、體驗設計',
    fields: ['資訊管理','研發管理'],
    roles: ['卡米爾公司 研發總監'],
  },
};

/* ============ 版型規則 ============ */
const id = new URLSearchParams(location.search).get('id') || 'weng';
const D = DETAILS[id];
const full = D.name + D.title;
const mainRole = D.roles[D.mainRole || 0];   // 主視覺只放 1 個代表職務，完整清單在「經歷」段
const has = { stats: D.stats?.length, services: D.services?.length, skills: D.skills?.length >= 4,
  // 經歷段：職務超過主視覺放得下的 3 項，或有學歷／經歷認證／連結時才出現（否則主視覺已經講完了）
  roles: D.roles.length > 1 || D.education?.length || D.certs?.length || D.links?.length };

const HERO_FIELDS = 3;   // 主視覺最多放幾個領域；更多的完整列在「專長」段
const dots = items => `<ul class="dots">${items.map(x => Array.isArray(x) ? `<li><b>${x[0]}</b>${x[1]}</li>` : `<li>${x}</li>`).join('')}</ul>`;
const SECTIONS = [
  has.services && { id: 'services', nav: '可提供的服務', label: 'SERVICES', h: '可提供的服務', body: `
      <div class="services">
        ${D.services.map(g => `<article class="svc"><h3>${g.name}</h3>${dots(g.items)}</article>`).join('')}
        <aside class="midcta" aria-label="預約諮詢"><p><b>對以上服務有興趣？</b>先聊聊您的需求。</p>
          <a class="btn btn--primary" href="#contact">預約諮詢 <span class="arrow" aria-hidden="true">→</span></a></aside>
      </div>` },
  has.skills && { id: 'skills', nav: '專長', label: 'EXPERTISE', h: '專長', body: `
      ${D.fields.length > HERO_FIELDS ? `<p class="sub">專業領域</p><ul class="skills skills--field">${D.fields.map(f => `<li class="pill">${f}</li>`).join('')}</ul>` : ''}
      ${D.skillGroups?.length
        ? `<div class="skillcols">${D.skillGroups.map(g => `<div><h3>${g.name}</h3>${dots(g.items).replace('class="dots"', 'class="dots dots--one"')}</div>`).join('')}</div>`
        : `<div class="skillcols skillcols--flat">${dots(D.skills)}</div>`}` },
  has.roles && (() => {
    const cols = [['現任職務', D.roles], ['學歷', D.education], ['經歷與認證', D.certs]].filter(c => c[1]?.length)
      .map(([h, l]) => `<div class="col"><h3>${h}</h3><ul>${l.map(x => `<li>${x}</li>`).join('')}</ul></div>`);
    if (D.links?.length) cols.push(`<div class="col"><h3>更多資訊</h3><ul>${D.links.map(([t, sub, url]) =>
      `<li><a href="${url}" target="_blank" rel="noopener noreferrer"><span>${t}<small>${sub}</small></span><span aria-hidden="true">↗</span><span class="sr-only">（另開新分頁）</span></a></li>`).join('')}</ul></div>`);
    return { id: 'roles', nav: D.education?.length ? '經歷與學歷' : '經歷', label: 'PROFILE', h: D.education?.length ? '經歷與學歷' : '經歷',
      body: `<div class="cols cols--${Math.min(cols.length, 3)}">${cols.join('')}</div>` };
  })(),
].filter(Boolean);

const second = SECTIONS[0] ? `<a class="btn btn--line" href="#${SECTIONS[0].id}">看${SECTIONS[0].nav} <span aria-hidden="true">↓</span></a>` : '';
document.getElementById('app').innerHTML = `
  <section class="hero" aria-labelledby="name" data-deco="dots" data-role="none">
    <span class="hero__deco" aria-hidden="true"></span>
    <div class="wrap">
      <a class="back" href="index.html#experts">← 返回專家陣容</a>
      <div class="hero__text">
        <ul class="hero__fields" aria-label="主要領域">${D.fields.slice(0, HERO_FIELDS).map(f => `<li>${f}</li>`).join('')}</ul>
        <h1 id="name">${D.name}<small>${D.title}</small></h1>
        <p class="hero__role">${mainRole}</p>
        <p class="hero__tagline">${D.tagline}</p>
        ${SECTIONS.length ? '' : `<p class="hero__invite" id="contact"><b>想邀請${full}授課、演講或企業輔導？</b>留下需求，我們會盡快與您聯繫安排。</p>`}
        <div class="hero__cta"><a class="btn btn--white" href="#contact">預約諮詢 <span class="arrow" aria-hidden="true">→</span></a>${second}</div>
      </div>
      <div class="portrait">
        <span class="portrait__bg" aria-hidden="true"></span>
        ${D.img ? `<span class="portrait__person"><img src="img/${D.img}-cut.webp" alt="${full}的照片"></span>` : `<span class="photo__initial"><span>${D.name[0]}</span></span>`}
      </div>
      ${has.stats ? `<div class="stats" aria-label="${D.statsCaption || '累積成果'}">${D.statsCaption ? `<p class="stats__cap">${D.statsCaption}</p>` : ''}${D.stats.map(([n, t]) => `<div class="stat"><b>${n}</b><span>${t}</span></div>`).join('')}</div>` : ''}
    </div>
  </section>
  ${SECTIONS.length >= 3 ? `<nav class="subnav" aria-label="本頁內容"><div class="wrap" id="subnav">${SECTIONS.map(x => `<a href="#${x.id}">${x.nav}</a>`).join('')}</div></nav>` : ''}
  ${SECTIONS.map((x, i) => `
  <section class="sec ${i % 2 === 0 ? 'sec--soft' : ''}" id="${x.id}" aria-labelledby="h-${x.id}">
    <div class="wrap">
      <header class="sec__head"><p class="label">${x.label}</p><h2 id="h-${x.id}">${x.h}</h2></header>
      <div>${x.body}</div>
    </div>
  </section>`).join('')}
  ${SECTIONS.length ? `<section class="cta" id="contact" aria-labelledby="h-cta">
    <div class="wrap">
      <div><h2 id="h-cta">想邀請${full}授課、演講或企業輔導？</h2><p>留下需求，我們會盡快與您聯繫安排。</p></div>
      <a class="btn btn--white" href="#contact">預約諮詢 <span class="arrow" aria-hidden="true">→</span></a>
    </div>
  </section>` : ''}
  <section class="more ${SECTIONS.length ? '' : 'more--white'}" aria-labelledby="h-more">
    <div class="wrap">
      <header class="head"><div class="head__top"><h2 id="h-more"><span class="hl">相關領域</span>專家</h2><span class="head__line" aria-hidden="true"></span></div><p class="head__sub">與${full}專業領域相近的專家，點頭像看完整經歷。</p></header>
      <div class="grid" id="others"></div>
      <div class="more__all"><a class="btn btn--primary" href="index.html#experts">查看全部專家 <span class="arrow" aria-hidden="true">→</span></a></div>
    </div>
  </section>`;
document.querySelectorAll('[data-tv]').forEach(a => a.addEventListener('click', e => {
  e.preventDefault(); document.body.dataset.tone = a.dataset.tv;
  document.querySelectorAll('[data-tv]').forEach(x => x.toggleAttribute('aria-current', x === a));
}));
document.querySelectorAll('[data-sb]').forEach(a => a.addEventListener('click', e => {
  e.preventDefault(); document.body.dataset.statbox = a.dataset.sb;
  document.querySelectorAll('[data-sb]').forEach(x => x.toggleAttribute('aria-current', x === a));
}));
document.querySelectorAll('[data-nv]').forEach(a => a.addEventListener('click', e => {
  e.preventDefault(); document.body.dataset.nav = a.dataset.nv;
  document.querySelectorAll('[data-nv]').forEach(x => x.toggleAttribute('aria-current', x === a));
}));
document.title = `${full}｜專家詳情頁通用版預覽`;

// 服務清單超過 3 項：手機版先收合（電腦版按鈕隱藏、全部顯示）
document.querySelectorAll('.svc').forEach((svc, i) => {
  const n = svc.querySelectorAll('.dots li').length;
  if (n <= 3) return;
  const ul = svc.querySelector('.dots'); ul.id = `svc-list-${i}`;
  svc.classList.add('is-collapsed');
  const btn = document.createElement('button');
  btn.type = 'button'; btn.className = 'svc__more'; btn.setAttribute('aria-controls', ul.id); btn.setAttribute('aria-expanded', 'false');
  const label = () => { const open = !svc.classList.contains('is-collapsed');
    btn.innerHTML = open ? '收合 <span aria-hidden="true">▴</span>' : `展開全部 ${n} 項 <span aria-hidden="true">▾</span>`; btn.setAttribute('aria-expanded', open); };
  btn.addEventListener('click', () => { svc.classList.toggle('is-collapsed'); label(); });
  label(); svc.append(btn);
});
document.querySelectorAll('[data-id]').forEach(a => a.toggleAttribute('aria-current', a.dataset.id === id));

// 相關領域專家：領域重疊最多的排前面，取 4 位
const ME = window.PEOPLE.find(p => p.zh === D.name);
const overlap = p => p.fields.filter(f => D.fields.includes(f)).length;
const others = window.PEOPLE.filter(p => p !== ME).map((p, i) => ({ p, n: overlap(p), i }))
  .sort((a, b) => b.n - a.n || a.i - b.i).slice(0, 4).map(x => x.p);
document.getElementById('others').innerHTML = others.map(p => `
  <article class="card">
    <h3 class="sr-only">${p.zh}</h3>
    <a class="photo" href="${p.url}" target="_blank" rel="noopener noreferrer" aria-label="查看完整經歷：${p.zh}（另開新分頁）">
      <span class="photo__bg" aria-hidden="true"></span>
      <span class="photo__hover" aria-hidden="true">查看完整經歷 <span class="arrow">→</span></span>
      ${p.img ? `<span class="photo__person"><img src="img/${p.img}-cut.webp" alt=""></span>` : `<span class="photo__initial" aria-hidden="true"><span>${p.zh[0]}</span></span>`}
      <span class="photo__name">${p.zh}</span>
    </a>
    <ul class="exp">${p.exp.slice(0, 2).map(e => `<li>${e}</li>`).join('')}</ul>
    <ul class="tags">${p.tags.slice(0, 3).map(t => `<li>${t}</li>`).join('')}</ul>
    <div class="quote-wrap"><blockquote class="quote">${p.quote ? `<p>${p.quote}</p>` : ''}</blockquote></div>
    <div class="card__more"><a href="${p.url}" target="_blank" rel="noopener noreferrer" tabindex="-1" aria-label="查看完整經歷：${p.zh}（另開新分頁）">查看完整經歷 <span class="arrow">→</span></a></div>
  </article>`).join('');

/* ===== 動態效果（不載入額外工具；系統關閉動態時全部略過）=====
   #86  逐行揭示：主視覺的領域、名字、職務、介紹、按鈕，一行行從下方滑上來
   #115 照片揭示：照片由下往上揭開，同時從稍大縮回原尺寸
   #155 數字計數：數據捲進畫面時才從 0 累加到目標值
   #125 柔和上浮：每個段落捲到時，標題與內容依序浮現 */
if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
  const EASE = 'cubic-bezier(.33,1,.68,1)';
  // 主視覺（文字、照片）一開始就顯示，不做進場動畫
  // 數字計數：先把最終寬度鎖住，跑數字時版面不會跳動
  const nums = [...document.querySelectorAll('.stat b')];
  nums.forEach(b => { b.dataset.final = b.textContent; b.style.minWidth = b.getBoundingClientRect().width + 'px'; b.style.display = 'inline-block'; b.textContent = '0'; });
  const count = b => { const m = b.dataset.final.match(/^([\d,]+)(.*)$/); if (!m) { b.textContent = b.dataset.final; return; }
    const to = +m[1].replace(/,/g, ''), t0 = performance.now(), dur = 1600;
    const tick = t => { const k = Math.min(1, (t - t0) / dur), v = Math.round(to * (1 - Math.pow(1 - k, 3)));
      b.textContent = v.toLocaleString('en-US') + (k === 1 ? m[2] : ''); if (k < 1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick); };
  const ioNum = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { count(e.target); ioNum.unobserve(e.target); } }), { threshold: .6 });
  nums.forEach(b => ioNum.observe(b));
  // 段落柔和上浮
  const groups = [...document.querySelectorAll('.sec .wrap, .cta .wrap, .more .wrap')];
  // 每段要依序浮現的東西：標題 → 服務卡片／經歷欄位一張張 → 其他內容
  const kids = g => { const head = g.querySelector(':scope > .sec__head, :scope > .head'), list = g.querySelector('.services, .cols, .grid');
    if (list) return [head, ...list.children, ...[...g.children].filter(x => x !== head && x !== list && !x.contains(list))].filter(Boolean);
    return head ? [head, ...[...g.children].filter(x => x !== head)] : [...g.children]; };
  groups.forEach(g => kids(g).forEach(el => el.style.opacity = 0));
  const ioSec = new IntersectionObserver(es => es.forEach(e => { if (!e.isIntersecting) return; ioSec.unobserve(e.target);
    kids(e.target).forEach((el, i) => { el.style.opacity = '';
      el.animate([{ opacity: 0, transform: 'translateY(24px)', filter: 'blur(6px)' }, { opacity: 1, transform: 'none', filter: 'blur(0)' }], { duration: 560, delay: i * 90, easing: EASE, fill: 'backwards' }); });
  }), { threshold: .15 });
  groups.forEach(g => ioSec.observe(g));
}

// 頁內導覽 scrollspy
const bar = document.getElementById('subnav');
if (bar) {
  const links = [...bar.querySelectorAll('a')];
  // 選單黏到頂部時加上 is-stuck（換白底＋陰影）
  const nav = bar.closest('.subnav');
  const stuck = () => nav.classList.toggle('is-stuck', nav.getBoundingClientRect().top <= 0 && scrollY > 0);
  addEventListener('scroll', stuck, { passive: true }); stuck();
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    // 捲回主視覺時清掉選取狀態，不會一直亮著上次看到的段落
    if (e.target.classList.contains('hero')) { links.forEach(a => a.setAttribute('aria-current', 'false')); return; }
    links.forEach(a => a.setAttribute('aria-current', a.hash === '#' + e.target.id));
    const cur = links.find(a => a.hash === '#' + e.target.id);
    if (cur && bar.scrollWidth > bar.clientWidth) bar.scrollTo({ left: cur.offsetLeft - (bar.clientWidth - cur.offsetWidth) / 2, behavior: 'smooth' });
  }), { rootMargin: '-40% 0px -55% 0px' });
  SECTIONS.forEach(x => io.observe(document.getElementById(x.id)));
  io.observe(document.querySelector('.hero'));
}
document.documentElement.style.scrollBehavior = matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
document.querySelectorAll('.toolbar button').forEach(b => b.addEventListener('click', () => {
  const r = document.documentElement.style;
  r.setProperty('--brand', b.dataset.c); r.setProperty('--brand-ink', b.dataset.ink);
  r.setProperty('--brand-deep', b.dataset.deep); r.setProperty('--accent', b.dataset.accent);
  document.querySelectorAll('.toolbar button').forEach(x => x.setAttribute('aria-pressed', x === b));
}));
</script>
